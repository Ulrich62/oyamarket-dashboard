<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080C14" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0C9653" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0C9653" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" rx="220" fill="url(#bgGrad)" />
  <circle cx="540" cy="540" r="420" fill="url(#glow)" />
  <rect width="1080" height="1080" rx="220" fill="none" stroke="#1F2937" stroke-width="16" />

  <!-- Centered Logo Group -->
  <g transform="translate(54, 54) scale(0.9)">
    <!-- Basket O -->
    <path d="M 240 400 L 840 400 L 740 850 L 340 850 Z" fill="none" stroke="#0C9653" stroke-width="68" stroke-linejoin="round"/>
    <path d="M 340 400 C 340 150 740 150 740 400" fill="none" stroke="#0C9653" stroke-width="68" stroke-linecap="round"/>
    <!-- Lightning -->
    <path d="M 600 200 L 400 600 L 550 600 L 480 950 L 750 450 L 580 450 Z" fill="#FF6B00" stroke="#111827" stroke-width="12" stroke-linejoin="round"/>
  </g>
</svg>